<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Desk Plan 3D</title>
<style>
  :root { --bg:#eef0f3; --panel:rgba(255,255,255,.92); --ink:#1d2330; --muted:#5b6475; --line:#d3d8e0;
          --accent:#2f6fde; --warn:#c62828; --ok:#1b7f3b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
              font:12px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
  #wrap { position:fixed; inset:0; }
  #wrap canvas { display:block; touch-action:none; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 8px;
           box-shadow:0 1px 4px rgba(0,0,0,.08); }
  #hud { position:fixed; top:max(8px,env(safe-area-inset-top)); left:8px; right:8px; display:flex; flex-direction:column;
         gap:6px; align-items:flex-start; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  #menuRow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #menuBtn { box-shadow:0 1px 4px rgba(0,0,0,.08); font-weight:600; }
  .pill { color:var(--warn); font-weight:600; border-color:#e6b3b3; background:#fff5f5; }
  #menu { width:min(380px, calc(100vw - 16px)); max-height:calc(100vh - 230px); overflow:auto; }
  #menu .row.top { display:flex; justify-content:space-between; align-items:center; }
  #menu h4 { margin:8px 0 0; font-size:12px; }
  details summary { cursor:pointer; font-weight:600; list-style:none; user-select:none; margin-top:8px; }
  details summary::-webkit-details-marker { display:none; }
  details summary::before { content:"▸ "; color:var(--muted); }
  details[open] summary::before { content:"▾ "; }
  #clrTable { border-collapse:collapse; margin-top:4px; width:100%; }
  #clrTable td { padding:1px 0; vertical-align:top; }
  #clrTable td.v { text-align:right; padding-left:10px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .neg { color:var(--warn); font-weight:600; } .pos { color:var(--ok); }
  #overlaps { margin-top:4px; color:var(--warn); font-weight:600; }
  #notes h4 { margin:6px 0 2px; font-size:12px; }
  #notes ul { margin:0; padding-left:16px; } #notes li { margin:2px 0; }
  #notes .flag { color:#a15c00; }
  .sub { color:var(--muted); font-size:11px; }
  #bottom { position:fixed; left:8px; right:8px; bottom:max(8px,env(safe-area-inset-bottom));
            display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; }
  #bottom > * { pointer-events:auto; }
  #bar { display:flex; flex-wrap:wrap; gap:4px 10px; justify-content:center; max-width:760px; }
  .grp { display:flex; align-items:center; gap:3px; }
  .grp > span { color:var(--muted); font-size:11px; margin-right:1px; }
  button { font:inherit; font-size:12px; border:1px solid var(--line); background:#fff; color:var(--ink);
           border-radius:6px; padding:4px 7px; cursor:pointer; touch-action:manipulation; white-space:nowrap; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.4; cursor:default; transform:none; }
  #sel { width:min(420px, 100%); }
  #sel.hidden { display:none; }
  #room { width:min(420px, 100%); }
  #room .row.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .slide { display:flex; align-items:center; gap:6px; margin:4px 0; }
  .slide > span { width:34px; color:var(--muted); font-size:11px; }
  .slide input[type=range] { flex:1; min-width:0; accent-color:var(--accent); }
  .slide output { width:96px; text-align:right; font-variant-numeric:tabular-nums; font-size:11px; }
  .slide button { width:28px; padding:3px 0; }
  #sel .row { display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin:3px 0; }
  #sel .row.top { justify-content:space-between; flex-wrap:nowrap; }
  #sel label { display:flex; align-items:center; gap:3px; font-size:11px; color:var(--muted); }
  #sel input { width:62px; font:inherit; font-size:12px; padding:3px 4px; border:1px solid var(--line); border-radius:5px; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .lbl { position:absolute; left:0; top:0; white-space:nowrap; font-size:10.5px; line-height:1.25;
         background:rgba(255,255,255,.82); border:1px solid rgba(0,0,0,.12); border-radius:4px; padding:1px 4px;
         color:#222; will-change:transform; }
  .lbl b { font-weight:600; }
  .lbl.clr { background:rgba(255,248,214,.95); border-color:#d8b84a; font-weight:600; }
  .lbl.clr.bad { background:rgba(255,226,226,.95); border-color:#d55; color:var(--warn); }
  #title { font-weight:700; }
  @media (max-width:600px) {
    .lbl { font-size:9px; padding:0 3px; }
    .lbl .d { display:none; }
    #menu { font-size:11px; }
    button { padding:4px 6px; }
  }
</style>
</head>
<body>
<div id="wrap"></div>
<div id="labels"></div>

<div id="hud">
  <div id="menuRow">
    <button id="menuBtn" aria-expanded="false" aria-controls="menu">☰ Menu</button>
    <button id="ovPill" class="pill" hidden></button>
    <button id="wallPill" class="pill" hidden>⚠ Arm hits the wall</button>
    <button id="armPill" class="pill" hidden></button>
  </div>
  <div id="menu" class="panel" hidden>
    <div class="row top"><b id="title">Desk Plan 3D</b><button id="menuClose" aria-label="Close menu">✕</button></div>
    <div class="sub">Origin: back-left corner of desktop. X→right, Y↑, Z→you. Inches (cm).</div>
    <h4>Clearances</h4>
    <table id="clrTable"></table>
    <div id="overlaps"></div>
    <details id="notes">
      <summary>⚠ Assumptions &amp; sources</summary>
      <div id="notesBody"></div>
    </details>
  </div>
</div>

<div id="bottom">
  <div id="sel" class="panel hidden">
    <div class="row top"><b id="selName"></b><button id="selClose" aria-label="Deselect">✕</button></div>
    <div class="row" id="modeSeg">
      <button data-mode="move" title="Move along the floor; from a front or side view it slides across the screen only">✥ Move</button>
      <button data-mode="x" title="Left / right only">↔ X</button>
      <button data-mode="z" title="Toward / away from you only">⤢ Z</button>
      <button data-mode="lift" title="Up / down only">↕ Lift</button>
      <button data-mode="rotate">⟳ Rotate</button>
      <span class="sub" id="modeHint"></span>
    </div>
    <div class="row">
      <label>X <input id="inX" type="number" step="0.25"></label>
      <label><span id="lblY">Y</span> <input id="inY" type="number" step="0.25"></label>
      <label>Z <input id="inZ" type="number" step="0.25"></label>
      <label>° <input id="inR" type="number" step="1"></label>
    </div>
    <div class="row">
      <button data-rot="-15">−15°</button><button data-rot="-1">−1°</button>
      <button data-rot="1">+1°</button><button data-rot="15">+15°</button>
      <button id="selReset">Reset this</button>
    </div>
    <div class="row" id="monRow" hidden>
      <label>Tilt <input id="inTilt" type="number" step="1" min="-30" max="45"></label>
      <button data-tilt="-5">−5°</button><button data-tilt="5">+5°</button>
      <button id="portraitBtn">Portrait</button>
      <span class="sub">+ top toward you, − away (+45° to −30°)</span>
    </div>
    <div class="sub" id="selCm"></div>
  </div>
  <div id="room" class="panel" hidden>
    <div class="row top"><b>Distance from the wall</b><button id="roomClose" aria-label="Close">✕</button></div>
    <div class="slide"><span>Desk</span><button data-nudge="deskWall" data-d="-0.25" aria-label="Desk closer">−</button>
      <input id="deskWall" type="range" min="0" max="24" step="0.25" aria-label="Desk to wall">
      <button data-nudge="deskWall" data-d="0.25" aria-label="Desk further">+</button><output id="deskWallOut"></output></div>
    <div class="slide"><span>ALEX</span><button data-nudge="alexWall" data-d="-0.25" aria-label="ALEX closer">−</button>
      <input id="alexWall" type="range" min="0" max="24" step="0.25" aria-label="ALEX to wall">
      <button data-nudge="alexWall" data-d="0.25" aria-label="ALEX further">+</button><output id="alexWallOut"></output></div>
    <div class="sub">From each back edge to the wall.</div>
  </div>
  <div id="bar" class="panel">
    <div class="grp"><span>Rack</span><button data-k="rack" data-v="2U">2U</button><button data-k="rack" data-v="4U">4U</button></div>
    <div class="grp"><span>Monitor</span><button data-k="mon" data-v="a" title="ASUS ProArt PA32QCV">a</button><button data-k="mon" data-v="b" title="INNOCN 34C1U">b</button><button data-k="mon" data-v="c" title="Dell U3425WE">c</button><button data-k="mon" data-v="d" title="Dell U2724D (current)">d·now</button></div>
    <div class="grp"><span>MacBook</span><button data-k="mac" data-v="13">13″</button><button data-k="mac" data-v="15">15″</button><button id="lapBtn">Hide</button></div>
    <div class="grp"><span>iPad</span><button data-k="ipad" data-v="left" title="Left of monitor">←</button><button data-k="ipad" data-v="above" title="Above monitor">↑</button><button data-k="ipad" data-v="below" title="Below monitor">↓</button><button data-k="ipad" data-v="right" title="Right of monitor">→</button></div>
    <div class="grp"><span>View</span><button data-view="top">Top</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="seated">Seated</button></div>
    <div class="grp"><button id="undoBtn" title="Undo (Ctrl/⌘+Z)">↶ Undo</button><button id="redoBtn" title="Redo (Ctrl/⌘+Shift+Z)">↷ Redo</button><button id="lblBtn">Labels</button><button id="wallBtn" class="on">Wall</button><button id="roomBtn">Wall gaps</button><button id="resetBtn">Reset layout</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
// ============================================================================
// Units: inches. Origin = back-left corner of the desktop surface.
// X → right, Y → up, Z → toward the user.
// ============================================================================
const CM = 1 / 2.54, MM = 1 / 25.4, DEG = Math.PI / 180;
const V3 = THREE.Vector3;

// ---- 1. IKEA LAGKAPTEN top on MITTBACK trestles ----------------------------
const DESK_W_CM = 120;            // change to 140 if that's your top
const DESK_D_CM = 60, TOP_T_CM = 3.0;
const DESK_H_CM = 73;             // IKEA lists LAGKAPTEN/MITTBACK desk min (flat) height 73 cm
const DESK_W = DESK_W_CM * CM, DESK_D = DESK_D_CM * CM, TOP_T = TOP_T_CM * CM, DESK_H = DESK_H_CM * CM;
const TRESTLE = { depth: 56 * CM, post: 1.4, inset: 12 * CM }; // assumed, simplified shape

// ---- 2. Gator Frameworks Elite desktop rack ---------------------------------
const RACK_W = 21, RACK_D = 14, RACK_USABLE_D = 12.75;
const RACKS = { '2U': { u: 2, h: 6.5, verified: false }, '4U': { u: 4, h: 10, verified: true } };
const DBX = { w: 19, h: 1.75, d: 8 };                 // depth assumed

// ---- 3. VIVO STAND-V101GT -----------------------------------------------------
// How the arm is built (VIVO assembly instructions + listing photos): pole screwed into the
// clamp base → anti-slip lock ring → "arm support" collar slid onto the pole, locked with a
// 6 mm hex (sets height) → lower arm on top of the collar, swivels around the pole → a vertical
// riser post at the elbow → gas-spring parallelogram arm pivoting on top of that riser (13" of
// travel) → VESA head: 180° swivel, −30°/+45° tilt, 180° rotation, quick-release plate.
// The listing gives the screen-center range: 8.75" (collar low, arm down) to 27.5" (collar at the
// pole top, arm up) and a 26" max extension measured with the gas arm level. The listing photos
// show the gas arm swinging from about 27° down to about 51° up. Segment lengths aren't
// published: L2 comes from the 13" travel over that swing, L1 fills the 26" extension after an
// assumed 3" head, and the riser and the collar's lowest point are solved so the model hits
// 8.75" and 27.5" exactly.
const COLLAR_H = 2.4;   // arm-support height, estimated from the listing photo
const ARM = { poleH: 13, poleR: 0.7, maxExt: 26, travel: 13, phiMin: -27, phiMax: 51, head: 3, headSwivel: 90,
  lowT: 1.5, centerMin: 8.75, centerMax: 27.5, tiltMin: -30, tiltMax: 45 };
ARM.sinLo = Math.sin(ARM.phiMin * Math.PI / 180); ARM.sinHi = Math.sin(ARM.phiMax * Math.PI / 180);
ARM.L2 = ARM.travel / (ARM.sinHi - ARM.sinLo);
ARM.L1 = ARM.maxExt - ARM.L2 - ARM.head;
ARM.collarMax = ARM.poleH - COLLAR_H;                                     // collar top flush with the pole top
ARM.riser = ARM.centerMax - ARM.L2 * ARM.sinHi - ARM.poleH - ARM.lowT;   // elbow post height
ARM.collarMin = ARM.centerMin - ARM.L2 * ARM.sinLo - COLLAR_H - ARM.lowT - ARM.riser;
const CLAMP_W = 2.4, CLAMP_D = 2.4, POLE_GAP = 1.5, COLLAR_GAP = 1, COLLAR_R = 1.15;

// ---- 4. Monitors (no stand) ---------------------------------------------------
const MONITORS = {
  a: { name: 'ASUS ProArt PA32QCV', w: 28.12, h: 16.52, d: 1.85, curve: 0 },
  b: { name: 'INNOCN 34C1U', w: 32.16, h: 14.4, d: 2.0, curve: 0 },
  c: { name: 'Dell U3425WE', w: 813.5 * MM, h: 359.1 * MM, d: 105.1 * MM, curve: 1900 * MM },
  d: { name: 'Dell U2724D', w: 612.2 * MM, h: 352.5 * MM, d: 50.1 * MM, curve: 0 },   // current monitor
};
const MON_VESA_Z = 3.5;    // z of the monitor's back (VESA) plane, default placement
const MON_CLEAR = 1;       // bottom edge ≥ 1" above tallest rack-top item

// ---- 5. iPad Pro 13" (M4), landscape ----------------------------------------
const IPAD = { w: 281.6 * MM, h: 215.5 * MM, d: 5.1 * MM };
const IPAD_GAP = 1;
const PLATE = { w: 4.7, h: 4.7, d: 0.25 };            // MagFlött plate, assumed

// ---- 6. MacBook Air M3 -------------------------------------------------------
const MACS = { 13: { w: 11.97, d: 8.46, h: 0.44 }, 15: { w: 13.40, d: 9.35, h: 0.45 } };
const MAC_OPEN = 110, MAC_BASE_FRAC = 0.6;           // base/lid thickness split assumed

// ---- 7. Sound Devices MixPre -------------------------------------------------
const MIXPRE = { w: 110 * MM, d: 114 * MM, h: 36 * MM };

// ---- 8. Apple Magic Keyboard with Numeric Keypad ----------------------------
const KB = { w: 16.48, d: 4.52, hFront: 0.16, hBack: 0.43 };
const KB_FRONT_GAP = 2;

// ---- 9. IKEA ALEX drawer unit on castors (wide), on the floor right of the desk ----
const ALEX = { w: 67 * CM, d: 48 * CM, h: 66 * CM, drawers: 6, castor: 1.6, gap: 1 };   // castor height, gap assumed

// ---- Back wall ----
const WALL_GAP = 1;          // default desk back edge to wall (adjustable in the Wall gaps panel)
const WALL_H = 96;           // 8 ft ceiling, assumed; height measured from the floor
const GAP_MAX = 24;          // slider range for wall gaps

// ---- Seated eye height, 6'5" person ----------------------------------------
const STATURE = 77;
const SEAT_H = 0.25 * STATURE + 1;          // popliteal height + shoe, rough
const SIT_EYE = 0.441 * STATURE;            // sitting eye height above seat, rough ratio
const EYE_Y = SEAT_H + SIT_EYE - DESK_H;    // relative to desktop surface

const NOTES = {
  flags: [
    `Desk top size 120 × 60 × 3 cm is assumed (DESK_W_CM constant at the top of the script; set 140 if needed).`,
    `MITTBACK trestle shape, ${(TRESTLE.depth / CM).toFixed(0)} cm footprint and inset are simplified/assumed.`,
    `Rack 2U height 6.5″ (same 21 × 14″ footprint) is unverified. Rack internals (1.5″ top/bottom panels, 1″ sides, open back) are simplified.`,
    `dbx 286s depth 8″ is assumed; drawn in the top rack space, front flush with the rack front.`,
    `VIVO STAND-V101GT: 13″ pole, 26″ max extension and 13″ of gas-spring travel are from retailer listings; the 8.75″–27.5″ screen-center range is from the Amazon listing images.`,
    `Arm segment lengths aren't published. Modelled as: lower arm ${ARM.L1.toFixed(1)}″, gas-spring arm ${ARM.L2.toFixed(1)}″ swinging ${ARM.phiMin}° to +${ARM.phiMax}° (read off the listing photos), ${ARM.head}″ head (adds to 26″). The elbow riser (${ARM.riser.toFixed(1)}″) and the collar's lowest setting (${ARM.collarMin.toFixed(2)}″) are solved so the full range is exactly 8.75–27.5″. Collar ${COLLAR_H}″ tall (from the photo), pole Ø 1.4″ and clamp 2.4 × 2.4″ are estimates. The clamp's left edge is 1.5″ from the rack.`,
    `The collar can't go above ${ARM.collarMax.toFixed(1)}″ (its top meets the pole top), so "1″ above the 4U rack" (11″) isn't possible; it stops at ${ARM.collarMax.toFixed(1)}″.`,
    `Monitor tilt pivots at the VESA point (the real tilt joint is slightly behind it). Portrait turns the iPad and its side arm with the monitor, as they share the VESA plate.`,
    `The arm's head is assumed level with the VESA center, and the screen is assumed to face the way the gas-spring arm points within the head's ±90° swivel.`,
    `VESA mount assumed at the panel center. Monitor back plane placed at z = ${MON_VESA_Z}″ by default.`,
    `INNOCN 34C1U: width 32.16″ from a retailer listing; height 14.4″ and depth 2.0″ (no stand) are estimates.`,
    `Dell U3425WE curve drawn as 1900R; panel thickness and rear-housing shape are approximate. The overlap box uses the full 813.5 × 359.1 × 105.1 mm envelope.`,
    `Monitor height rule: bottom edge 1″ above the tallest fixed rack-top item (MixPre, laptop deck). The open laptop lid isn't counted, so its collision with the monitor shows.`,
    `ergoiuon side-arm geometry and MagFlött plate (4.7 × 4.7 × 0.25″) are assumed; iPad front is set flush with the monitor's front, centered on the monitor's edge with a 1″ gap. With the iPad below, the auto height keeps the iPad's bottom 1″ above the rack-top items.`,
    `MacBook base/lid thickness split (60/40 of closed height) and lid length (= depth) are assumed. Laptop and MixPre fronts are flush with the rack front.`,
    `ALEX (fixed in place, except its wall gap): ${ALEX.gap}″ gap from the desk's right edge, ${ALEX.castor}″ castor height and equal drawer heights are assumed.`,
    `Back wall is 8 ft tall (assumed). Desk and ALEX gaps to the wall default to ${WALL_GAP}″; set them with the Wall gaps button. The arm clamp's spine sits in the desk gap.`,
    `Seated eye height (${(EYE_Y + DESK_H).toFixed(1)}″ above floor, ${EYE_Y.toFixed(1)}″ above desk) is an anthropometric estimate for a 6′5″ person on a typical chair.`,
  ],
  sources: [
    `Desk height 73 cm: IKEA LAGKAPTEN/MITTBACK listing (min/flat height). ikea.com itself was blocked here; confirmed via IKEA regional listing in search.`,
    `Rack 4U: 21 × 14 × 10″, usable depth 12.75″ (from brief).`,
    `ASUS PA32QCV: 28.12 × 16.52 × 1.85″ without stand (ASUS spec, from brief).`,
    `Dell U3425WE: 813.5 × 359.1 × 105.1 mm without stand, 1900R.`,
    `iPad Pro 13″ (M4): 281.6 × 215.5 × 5.1 mm.`,
    `MacBook Air M3: 13″ 11.97 × 8.46 × 0.44″; 15″ 13.40 × 9.35 × 0.45″.`,
    `Magic Keyboard with Numeric Keypad: 16.48 × 4.52″, 0.16–0.43″ tall.`,
    `MixPre: 110 × 114 × 36 mm (from brief).`,
    `Dell U2724D (current monitor): 612.2 × 352.5 × 50.1 mm without stand.`,
    `IKEA ALEX drawer unit on castors (wide): 67 W × 48 D × 66 H cm, 6 drawers.`,
    `VIVO V101GT build (assembly instructions, via search): pole screws into the base; "arm support" collar slides on and locks with a 6 mm hex; lower arm sits on top and swivels; gas-spring arm sits on the lower arm's end; tension set with a hex key at the gas arm's root (clockwise = lighter monitors, counter-clockwise = heavier); VESA head swivels 180°, tilts −30° to +45°, rotates 180°.`,
    `VIVO listing images: screen-center height 8.75″ to 27.5″; max arm extension 26″ (pole to VESA, gas arm level); 33 lb capacity; VESA 75 × 75 and 100 × 100.`,
    `Apple, ASUS, INNOCN and VIVO sites were blocked from the build environment. Apple figures match Apple's published specs as quoted by third parties.`,
  ],
};

// ============================================================================
// Scene
// ============================================================================
const wrap = document.getElementById('wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
wrap.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef0f3);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 3000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.screenSpacePanning = true;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.maxDistance = 600;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.4); sun.position.set(30, 90, 70); scene.add(sun);

// floor + grid (12" squares)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshLambertMaterial({ color: 0xe2e4e8 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(DESK_W / 2, -DESK_H - 0.01, DESK_D / 2); scene.add(floor);
const grid = new THREE.GridHelper(240, 20, 0xbfc4cc, 0xd0d4da); grid.position.set(DESK_W / 2, -DESK_H, DESK_D / 2); scene.add(grid);
const axes = new THREE.AxesHelper(3); axes.position.set(0, 0.02, 0); scene.add(axes);

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// ============================================================================
// Mesh helpers
// ============================================================================
const EDGE_MAT = new THREE.LineBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.35 });
const COLL_MAT = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.2, depthWrite: false });
const RED = new THREE.Color(0xe53935);

function addMesh(u, part, geom, color, parent, pos) {
  const m = new THREE.Mesh(geom, new THREE.MeshLambertMaterial({ color }));
  m.userData = { base: new THREE.Color(color), unit: u.selId || u.id, part: u.id + ':' + part };
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  (parent || u.group).add(m);
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom, 25), EDGE_MAT));
  u.meshes.push(m);
  return m;
}

function refreshDependents(oldTop) {
  const newTop = rackTopY();
  for (const id of ['laptop', 'mixpre']) {

    if (!u.moved) u.state = DEFAULTS[id]();

const STORE_KEY = 'deskplan3d.v1';

if (saved && saved.S) {
  const o = saved.S;
  if (o.rack in RACKS) S.rack = o.rack;
  if (o.mon in MONITORS) S.mon = o.mon;
  if (o.mac in MACS) S.mac = +o.mac;
  if (IPAD_SIDES.includes(o.ipad)) S.ipad = o.ipad;
  if (typeof o.laptop === 'boolean') S.laptop = o.laptop;
  if (saved.v >= 2 && typeof o.labels === 'boolean') S.labels = o.labels;
  if (typeof o.wall === 'boolean') S.wall = o.wall;
  for (const k of ['deskWall', 'alexWall']) if (Number.isFinite(o[k])) S[k] = Math.min(GAP_MAX, Math.max(0, o[k]));
  if (['move', 'x', 'z', 'lift', 'rotate'].includes(o.mode)) S.mode = o.mode;
}
let saveTimer = 0;
function saveNow() {
  clearTimeout(saveTimer); saveTimer = 0;
  const data = { v: 2, S: { ipad: S.ipad, rack: S.rack, mon: S.mon, mac: S.mac, laptop: S.laptop, labels: S.labels, wall: S.wall, deskWall: S.deskWall, alexWall: S.alexWall, mode: S.mode }, units: {},
    cam: { p: camera.position.toArray(), t: controls.target.toArray() } };
  for (const id of ORDER) { const u = units[id]; data.units[id] = { state: u.state, moved: u.moved, autoY: u.autoY }; }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable: just don't persist */ }
}
const scheduleSave = () => { if (!saveTimer) saveTimer = setTimeout(saveNow, 300); };
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

Object.values(units).forEach(u => u.build(u));
units.monitor.autoY = true;
ORDER.forEach(resetUnit);
units.alex.state = DEFAULTS.alex(); apply(units.alex);
if (saved && saved.units) for (const id of ORDER) {
  const v = saved.units[id], st = v && v.state;
  if (!st || !['x', 'y', 'z', 'ry'].every(k => Number.isFinite(st[k]))) continue;
  const u = units[id];
  u.state = { x: st.x, y: st.y, z: st.z, ry: st.ry }; u.moved = !!v.moved;
  if (id === 'monitor') { u.state.tilt = Number.isFinite(st.tilt) ? st.tilt : 0; u.state.roll = st.roll === 90 ? 90 : 0; }
  if (id === 'monitor') { u.autoY = v.autoY !== false; if (u.autoY) u.state.y = monitorAutoY(); }
  apply(u);
}

// ============================================================================
// Arm solve: collar → elbow (horizontal) → pneumatic segment → tilt head → VESA
// ============================================================================
function updateArm() {
  const u = units.arm;
  [...u.group.children].forEach(c => { u.group.remove(c); disposeTree(c); });
  u.meshes = []; u.colliders = []; u.named = {};
  const P = units.pole.state, Mo = units.monitor.state;
  const yLow = P.y + COLLAR_H + ARM.lowT / 2;              // lower arm centerline, on top of the collar
  const yRoot = P.y + COLLAR_H + ARM.lowT + ARM.riser;    // gas-spring pivot, on top of the elbow riser
  const fwd = new V3(Math.sin(Mo.ry), 0, Math.cos(Mo.ry));
  const vesa = new V3(Mo.x, Mo.y, Mo.z);
  const E = vesa.clone().addScaledVector(fwd, -ARM.head); // gas-spring arm end (head swivel axis)
  // gas-spring pitch from the height difference, held to its phiMin..phiMax swing
  const rise = E.y - yRoot, phiRaw = Math.asin(Math.max(-1, Math.min(1, rise / ARM.L2))) / DEG;
  const heightOk = rise >= ARM.L2 * ARM.sinLo - 1e-6 && rise <= ARM.L2 * ARM.sinHi + 1e-6;
  const phi = Math.max(ARM.phiMin, Math.min(ARM.phiMax, phiRaw));
  const L1 = ARM.L1, L2h = ARM.L2 * Math.cos(phi * DEG);
  // two-link solve in plan: pole axis → elbow → E
  const S0 = new V3(P.x, yLow, P.z);
  const dx = E.x - S0.x, dz = E.z - S0.z, d = Math.hypot(dx, dz);
  const dir = d > 1e-6 ? new V3(dx / d, 0, dz / d) : new V3(1, 0, 0);

// ============================================================================
// Selection panel
// ============================================================================
const $ = id => document.getElementById(id);
const selEl = $('sel'), inX = $('inX'), inY = $('inY'), inZ = $('inZ'), inR = $('inR');
function select(id) { selected = id; update(); }
function rotateBy(deg) {
  const u = units[selected];
  u.state.ry = Math.round(u.state.ry / DEG + deg) * DEG; u.moved = true;
}
function syncSelPanel() {
  selEl.classList.toggle('hidden', !selected);
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  $('modeHint').textContent = matchMedia('(pointer:fine)').matches ? 'Shift-drag lifts · Alt-drag rotates' : '';
  if (!selected) return;
  const u = units[selected], s = u.state;
  $('selName').textContent = selected === 'monitor' ? `${mon().name} + iPad` : selected === 'laptop' ? `MacBook Air ${S.mac}″` : u.name;
  $('lblY').textContent = selected === 'pole' ? 'Collar' : 'Y';
  const set = (el, v) => { if (document.activeElement !== el) el.value = v; };
  set(inX, s.x.toFixed(2)); set(inY, s.y.toFixed(2)); set(inZ, s.z.toFixed(2));
  set(inR, (Math.round(s.ry / DEG * 10) / 10).toString());
  $('monRow').hidden = selected !== 'monitor';
  if (selected === 'monitor') { set($('inTilt'), (s.tilt || 0).toString()); $('portraitBtn').classList.toggle('on', !!s.roll); }
  $('selCm').textContent = `Pivot ${(s.x * 2.54).toFixed(1)}, ${(s.y * 2.54).toFixed(1)}, ${(s.z * 2.54).toFixed(1)} cm` +
    (selected === 'monitor' ? ' · pivot = VESA point' : selected === 'pole' ? ' · Y = collar bottom' : ' · pivot = bottom center');
}
const onInput = undoable(() => {
  if (!selected) return;
  const u = units[selected], n = v => (v === '' || isNaN(+v)) ? null : +v;
  const x = n(inX.value), y = n(inY.value), z = n(inZ.value), r = n(inR.value);
  if (x !== null) u.state.x = x;
  if (z !== null) u.state.z = z;
  if (r !== null) u.state.ry = r * DEG;
  if (y !== null && Math.abs(y - u.state.y) > 1e-6) { u.state.y = y; if (selected === 'monitor') u.autoY = false; }
  u.moved = true; apply(u); update();
});
[inX, inY, inZ, inR].forEach(el => el.addEventListener('change', onInput));
document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => { S.mode = b.dataset.mode; syncSelPanel(); scheduleSave(); }));
document.querySelectorAll('[data-rot]').forEach(b => b.addEventListener('click', undoable(() => {
  if (!selected) return; rotateBy(+b.dataset.rot); apply(units[selected]); update();
})));
const setTilt = undoable(t => {
  const u = units.monitor; u.state.tilt = t; u.moved = true; apply(u); update();
  $('inTilt').value = u.state.tilt;   // show the clamped value even while the box has focus
});
$('inTilt').addEventListener('change', () => { const v = +$('inTilt').value; if (Number.isFinite(v)) setTilt(v); });
document.querySelectorAll('[data-tilt]').forEach(b => b.addEventListener('click', () => setTilt((units.monitor.state.tilt || 0) + +b.dataset.tilt)));
$('portraitBtn').addEventListener('click', undoable(() => {
  const u = units.monitor; u.state.roll = u.state.roll ? 0 : 90; u.moved = true;
  if (u.autoY) u.state.y = monitorAutoY();
  apply(u); update();
}));
$('selReset').addEventListener('click', undoable(() => { if (selected) { resetUnit(selected); update(); } }));
$('selClose').addEventListener('click', () => select(null));

// ============================================================================
// Toolbar
// ============================================================================
function syncButtons() {
  document.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('on', String(S[b.dataset.k]) === b.dataset.v));
  $('lapBtn').textContent = S.laptop ? 'Hide' : 'Show';
  $('lblBtn').classList.toggle('on', S.labels);
  $('wallBtn').classList.toggle('on', S.wall);
}
document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', undoable(() => {
  const k = b.dataset.k, v = k === 'mac' ? +b.dataset.v : b.dataset.v;
  if (S[k] === v) return;
  const oldTop = rackTopY();
  S[k] = v;
  if (k === 'rack') rebuild(units.rack);
  if (k === 'mon' || k === 'ipad') rebuild(units.monitor);
  if (k === 'mac') { rebuild(units.laptop); if (!units.laptop.moved) units.laptop.state = DEFAULTS.laptop(); }
  refreshDependents(oldTop);
  update();
})));
$('lapBtn').addEventListener('click', undoable(() => { S.laptop = !S.laptop; if (!S.laptop && selected === 'laptop') selected = null; update(); }));
$('lblBtn').addEventListener('click', () => { S.labels = !S.labels; update(); });
$('wallBtn').addEventListener('click', () => { S.wall = !S.wall; update(); });
$('resetBtn').addEventListener('click', undoable(() => { ORDER.forEach(resetUnit); setView('default'); update(); }));
// ---- wall gaps panel ----
const setGap = (k, v) => { S[k] = Math.min(GAP_MAX, Math.max(0, Math.round(v * 4) / 4)); };
let roomBefore = null;
for (const k of ['deskWall', 'alexWall']) {
  const el = $(k);
  el.addEventListener('input', () => { if (!roomBefore) roomBefore = snapshot(); setGap(k, +el.value); update(); });
  el.addEventListener('change', () => { if (roomBefore) { commit(roomBefore); roomBefore = null; } });
}
document.querySelectorAll('[data-nudge]').forEach(b => b.addEventListener('click', undoable(() => {
  setGap(b.dataset.nudge, S[b.dataset.nudge] + +b.dataset.d); update();
})));
function syncRoom() {
  for (const k of ['deskWall', 'alexWall']) {
    if (document.activeElement !== $(k)) $(k).value = S[k];
    $(k + 'Out').textContent = `${S[k].toFixed(2)}″ (${(S[k] * 2.54).toFixed(1)} cm)`;
  }
  $('roomBtn').classList.toggle('on', !$('room').hidden);
}
$('roomBtn').addEventListener('click', () => { $('room').hidden = !$('room').hidden; syncRoom(); });
$('roomClose').addEventListener('click', () => { $('room').hidden = true; syncRoom(); });
$('undoBtn').addEventListener('click', undo);
$('redoBtn').addEventListener('click', redo);
syncUndo();

// ---- camera presets ----
const center = new V3((DESK_W + ALEX.gap + ALEX.w) / 2, -6, DESK_D / 2);
function setView(v) {
  const t = center.clone();
  const fit = Math.min(Math.max(0.95 / camera.aspect, 1), 2.0);   // back off on tall/narrow screens
  if (v === 'top') { t.set(DESK_W / 2, 0, DESK_D / 2); camera.position.set(t.x, 95, t.z + 0.01); }
  else if (v === 'front') { t.set(DESK_W / 2, 12, DESK_D / 2); camera.position.set(t.x, 12, DESK_D + 75); }
  else if (v === 'side') { t.set(DESK_W / 2, 12, DESK_D / 2); camera.position.set(DESK_W + 70, 12, t.z); }
  else if (v === 'seated') {
    const m = units.monitor.state; t.set(m.x, m.y, m.z);
    camera.position.set(DESK_W / 2, EYE_Y, DESK_D + 16);
  } else { camera.position.set(t.x + 42, 34, DESK_D + 78); }
  if (v !== 'seated') camera.position.sub(t).multiplyScalar(fit).add(t);
  controls.target.copy(t); camera.lookAt(t); controls.update();
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

// ---- notes ----
$('notesBody').innerHTML =
  `<h4 class="flag">Assumed / unverified</h4><ul>${NOTES.flags.map(t => `<li class="flag">${t}</li>`).join('')}</ul>` +
  `<h4>Sourced</h4><ul>${NOTES.sources.map(t => `<li>${t}</li>`).join('')}</ul>` +
  `<h4>Controls</h4><ul><li>Orbit: drag empty space (one finger / left mouse). Zoom: pinch / wheel. Pan: two fingers / right mouse.</li>` +
  `<li>Tap or click an object to select it, then drag it. Move slides along the floor (from a front or side view it only moves across the screen, so nothing jumps toward you). X, Z and Lift lock to one axis; Rotate turns it. You can also type exact values. With a mouse, Shift-drag lifts and Alt-drag rotates; R rotates 15°.</li>` +
  `<li>Your layout, toggles and view are saved in this browser and restored next visit. Reset layout starts over.</li>
  <li>Undo / Redo step back through moves, rotations and toggles (Ctrl/⌘+Z, Ctrl/⌘+Shift+Z). Camera moves aren't undone.</li>
  <li>Objects can't be scaled. The iPad, its side arm and the plate move with the monitor.</li></ul>`;
function setMenu(open) {
  $('menu').hidden = !open; $('menuBtn').setAttribute('aria-expanded', open);
  $('menuBtn').classList.toggle('on', open);
}
$('menuBtn').addEventListener('click', () => setMenu($('menu').hidden));
$('menuClose').addEventListener('click', () => setMenu(false));
$('ovPill').addEventListener('click', () => setMenu(true));
$('wallPill').addEventListener('click', () => setMenu(true));
$('armPill').addEventListener('click', () => setMenu(true));

// ============================================================================
// Render loop: project HTML labels each frame
// ============================================================================
const tmp = new V3();
function placeLabels() {
  const w = window.innerWidth, h = window.innerHeight;
  for (const L of labels) {
    if (!L.show || !L.html) { L.el.style.display = 'none'; continue; }
    tmp.copy(L.pos).project(camera);
    if (tmp.z > 1 || tmp.z < -1) { L.el.style.display = 'none'; continue; }
    L.el.style.display = '';
    const x = (tmp.x + 1) / 2 * w, y = (1 - tmp.y) / 2 * h;
    L.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
  }
}
setView('default');
if (saved && saved.cam && [...saved.cam.p, ...saved.cam.t].length === 6 && [...saved.cam.p, ...saved.cam.t].every(Number.isFinite)) {
  camera.position.fromArray(saved.cam.p); controls.target.fromArray(saved.cam.t); controls.update();
}
controls.addEventListener('change', scheduleSave);
update();
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
  placeLabels();
})();
})();
</script>
</body>
</html>
